# Continuous deploy to the same WEDOS Lex install used by bootstrap:
#   /home/lucky/projects/apps/lex
#   docker-compose.lex.prod.yml  (synced from GitHub clone)
#   .env.prod                    (server-only; never committed; must already exist)
#
# Required GitHub secrets:
#   LEX_WEDOS_SSH_HOST
#   LEX_WEDOS_SSH_USER
#   LEX_WEDOS_SSH_KEY
# Optional:
#   LEX_WEDOS_SSH_PORT   (default 22)
#   LEX_FE_DEPLOY_TOKEN  (PAT with read to Lakyn80/NalusFE — enables FE image rebuild)
#
# After CI succeeds on main, this workflow builds/pushes the API image to GHCR
# (SHA tag + optional extra tag) and SSHs into WEDOS to pull + recreate only
# the API service at ghcr.io/lakyn80/nalus-api:${DEPLOY_SHA}. Frontend image is
# rebuilt only when LEX_FE_DEPLOY_TOKEN is configured; otherwise the existing
# LEX_FE_IMAGE pin is kept. Qdrant is never recreated by this workflow.

name: Deploy Lex WEDOS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Extra GHCR tag to push (production always deploys the commit SHA)
        required: false
        default: latest

concurrency:
  group: lex-wedos-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LEX_APP_DIR: /home/lucky/projects/apps/lex
  LEX_API_IMAGE: ghcr.io/lakyn80/nalus-api
  LEX_FE_IMAGE: ghcr.io/lakyn80/nalus-fe

jobs:
  publish-and-deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve ref to deploy
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.inputs.image_tag || 'latest' }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "${{ secrets.LEX_FE_DEPLOY_TOKEN }}" ]]; then
            echo "build_fe=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_fe=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.LEX_API_IMAGE }}:${{ steps.ref.outputs.sha }}
            ${{ env.LEX_API_IMAGE }}:${{ steps.ref.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout frontend
        if: steps.ref.outputs.build_fe == 'true'
        uses: actions/checkout@v4
        with:
          repository: Lakyn80/NalusFE
          path: _nalus_fe
          token: ${{ secrets.LEX_FE_DEPLOY_TOKEN }}

      - name: Build and push frontend image
        if: steps.ref.outputs.build_fe == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./_nalus_fe
          file: ./_nalus_fe/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.LEX_FE_IMAGE }}:${{ steps.ref.outputs.sha }}
            ${{ env.LEX_FE_IMAGE }}:${{ steps.ref.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH (same Lex install path)
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ steps.ref.outputs.sha }}
          BUILD_FE: ${{ steps.ref.outputs.build_fe }}
        with:
          host: ${{ secrets.LEX_WEDOS_SSH_HOST }}
          username: ${{ secrets.LEX_WEDOS_SSH_USER }}
          key: ${{ secrets.LEX_WEDOS_SSH_KEY }}
          port: ${{ secrets.LEX_WEDOS_SSH_PORT || 22 }}
          envs: GHCR_USER,GHCR_TOKEN,DEPLOY_SHA,BUILD_FE
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/lucky/projects/apps/lex
            free -h
            df -h /

            if [ ! -d backend/.git ]; then
              echo "backend clone missing under /home/lucky/projects/apps/lex/backend" >&2
              exit 1
            fi
            if [ ! -f .env.prod ]; then
              echo ".env.prod is missing" >&2
              exit 1
            fi
            if [ -z "${DEPLOY_SHA:-}" ]; then
              echo "DEPLOY_SHA is empty" >&2
              exit 1
            fi

            git -C backend fetch origin main
            git -C backend checkout --force "$DEPLOY_SHA"
            cp -f backend/docker-compose.lex.prod.yml ./docker-compose.lex.prod.yml

            if grep -q '^LEX_API_IMAGE=' .env.prod; then
              sed -i "s|^LEX_API_IMAGE=.*|LEX_API_IMAGE=ghcr.io/lakyn80/nalus-api:${DEPLOY_SHA}|" .env.prod
            else
              echo "LEX_API_IMAGE=ghcr.io/lakyn80/nalus-api:${DEPLOY_SHA}" >> .env.prod
            fi
            if [ "$BUILD_FE" = "true" ]; then
              if grep -q '^LEX_FE_IMAGE=' .env.prod; then
                sed -i "s|^LEX_FE_IMAGE=.*|LEX_FE_IMAGE=ghcr.io/lakyn80/nalus-fe:${DEPLOY_SHA}|" .env.prod
              else
                echo "LEX_FE_IMAGE=ghcr.io/lakyn80/nalus-fe:${DEPLOY_SHA}" >> .env.prod
              fi
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose \
              -f docker-compose.lex.prod.yml \
              --env-file .env.prod \
              pull api
            docker compose \
              -f docker-compose.lex.prod.yml \
              --env-file .env.prod \
              up -d --no-deps api
            if [ "$BUILD_FE" = "true" ]; then
              docker compose \
                -f docker-compose.lex.prod.yml \
                --env-file .env.prod \
                pull frontend
              docker compose \
                -f docker-compose.lex.prod.yml \
                --env-file .env.prod \
                up -d --no-deps frontend
            fi
            docker logout ghcr.io || true

            API_HEALTHY=0
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8029/health >/dev/null; then
                echo "Lex API health check passed"
                API_HEALTHY=1
                break
              fi
              echo "Waiting for Lex API... attempt $i/30"
              sleep 3
            done
            if [ "$API_HEALTHY" -ne 1 ]; then
              echo "Lex API health check FAILED" >&2
              docker logs --tail=200 lex-api || true
              exit 1
            fi

            smoke_code=$(curl -sS -o /tmp/lex_fast_smoke.json -w "%{http_code}" \
              --connect-timeout 10 \
              --max-time 60 \
              -H "Content-Type: application/json; charset=utf-8" \
              -d '{"query":"neplatnost výpovědi z pracovního poměru","limit":3,"retrieval_profile":"fast"}' \
              http://127.0.0.1:8029/api/rag/legal-v2/case-similarity/search || true)
            if [ "$smoke_code" != "200" ]; then
              echo "FAST smoke FAILED http=${smoke_code}" >&2
              docker logs --tail=200 lex-api || true
              exit 1
            fi
            echo "FAST smoke passed http=${smoke_code}"
            rm -f /tmp/lex_fast_smoke.json

            ARCHIVE_SQLITE="data/storage/rag/archive/judgment_archive_v1.sqlite"
            ARCHIVE_BATCHES="data/batches"
            mkdir -p data/storage/rag/archive
            NEED_ARCHIVE_BUILD=0
            if [ ! -f "$ARCHIVE_SQLITE" ]; then
              NEED_ARCHIVE_BUILD=1
              echo "Archive sqlite missing; will build"
            else
              ARCHIVE_BYTES=$(wc -c < "$ARCHIVE_SQLITE" | tr -d ' ')
              echo "Archive sqlite present bytes=${ARCHIVE_BYTES}"
              if [ "${ARCHIVE_BYTES:-0}" -lt 1000000 ]; then
                NEED_ARCHIVE_BUILD=1
                echo "Archive sqlite too small; will rebuild"
              fi
            fi
            if [ "$NEED_ARCHIVE_BUILD" -eq 1 ]; then
              if [ ! -d "$ARCHIVE_BATCHES" ]; then
                echo "Archive batches dir missing: ${ARCHIVE_BATCHES}" >&2
                ls -la data || true
                exit 1
              fi
              BATCH_FILES=$(find "$ARCHIVE_BATCHES" -type f \( -name '*.json' -o -name '*.jsonl' \) 2>/dev/null | wc -l | tr -d ' ')
              echo "Archive build starting batches_dir=${ARCHIVE_BATCHES} batch_files=${BATCH_FILES}"
              if [ "${BATCH_FILES:-0}" -lt 1 ]; then
                echo "No batch JSON files found under ${ARCHIVE_BATCHES}" >&2
                find "$ARCHIVE_BATCHES" -maxdepth 2 -type f | head -n 50 || true
                exit 1
              fi
              docker compose \
                -f docker-compose.lex.prod.yml \
                --env-file .env.prod \
                run --rm --no-deps \
                --entrypoint python \
                -v "$(pwd)/data/storage:/app/storage" \
                -v "$(pwd)/data/batches:/app/batches:ro" \
                api scripts/legal_v2/build_judgment_archive_index.py \
                  --batches-dir /app/batches \
                  --sqlite-path /app/storage/rag/archive/judgment_archive_v1.sqlite
              docker compose \
                -f docker-compose.lex.prod.yml \
                --env-file .env.prod \
                up -d --no-deps api
              for i in $(seq 1 30); do
                if curl -sf http://127.0.0.1:8029/health >/dev/null; then
                  break
                fi
                sleep 3
              done
            fi

            archive_code=$(curl -sS -o /tmp/lex_archive_smoke.json -w "%{http_code}" \
              --connect-timeout 10 \
              --max-time 30 \
              http://127.0.0.1:8029/api/judgments/archive || true)
            if [ "$archive_code" != "200" ]; then
              echo "Archive smoke FAILED http=${archive_code}" >&2
              cat /tmp/lex_archive_smoke.json >&2 || true
              docker logs --tail=200 lex-api || true
              exit 1
            fi
            if ! grep -q '"index_ready":true' /tmp/lex_archive_smoke.json; then
              echo "Archive smoke index_ready!=true" >&2
              cat /tmp/lex_archive_smoke.json >&2 || true
              exit 1
            fi
            if ! grep -q '"document_count":[1-9]' /tmp/lex_archive_smoke.json; then
              echo "Archive smoke document_count empty" >&2
              cat /tmp/lex_archive_smoke.json >&2 || true
              exit 1
            fi
            echo "Archive smoke passed"
            rm -f /tmp/lex_archive_smoke.json

            echo "DEPLOY_SHA=${DEPLOY_SHA}"
            grep '^LEX_API_IMAGE=' .env.prod
            docker ps --filter name=lex-api --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
            docker inspect lex-api \
              --format 'status={{.State.Status}} restart={{.RestartCount}} oom={{.State.OOMKilled}} image={{.Config.Image}}'
            free -h
            df -h /
