# Continuous deploy to the same WEDOS Lex install used by bootstrap:
#   /home/lucky/projects/apps/lex
#   docker-compose.lex.prod.yml  (synced from GitHub clone)
#   .env.prod                    (server-only; never committed)
#
# Required GitHub secrets:
#   LEX_WEDOS_SSH_HOST
#   LEX_WEDOS_SSH_USER
#   LEX_WEDOS_SSH_KEY
# Optional:
#   LEX_WEDOS_SSH_PORT   (default 22)
#   LEX_FE_DEPLOY_TOKEN  (PAT with read to Lakyn80/NalusFE — enables FE image rebuild)
#
# After CI succeeds on main, this workflow builds/pushes the API image to GHCR
# and SSHs into WEDOS to pull + compose up. Frontend image is rebuilt only when
# LEX_FE_DEPLOY_TOKEN is configured; otherwise the existing LEX_FE_IMAGE pin is kept.

name: Deploy Lex WEDOS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy (default = latest)
        required: false
        default: latest

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LEX_APP_DIR: /home/lucky/projects/apps/lex
  LEX_API_IMAGE: ghcr.io/lakyn80/nalus-api
  LEX_FE_IMAGE: ghcr.io/lakyn80/nalus-fe

jobs:
  publish-and-deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve ref to deploy
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.inputs.image_tag || 'latest' }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "${{ secrets.LEX_FE_DEPLOY_TOKEN }}" ]]; then
            echo "build_fe=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_fe=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.LEX_API_IMAGE }}:${{ steps.ref.outputs.sha }}
            ${{ env.LEX_API_IMAGE }}:${{ steps.ref.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout frontend
        if: steps.ref.outputs.build_fe == 'true'
        uses: actions/checkout@v4
        with:
          repository: Lakyn80/NalusFE
          path: _nalus_fe
          token: ${{ secrets.LEX_FE_DEPLOY_TOKEN }}

      - name: Build and push frontend image
        if: steps.ref.outputs.build_fe == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./_nalus_fe
          file: ./_nalus_fe/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.LEX_FE_IMAGE }}:${{ steps.ref.outputs.sha }}
            ${{ env.LEX_FE_IMAGE }}:${{ steps.ref.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH (same Lex install path)
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ steps.ref.outputs.sha }}
          DEPLOY_TAG: ${{ steps.ref.outputs.tag }}
          BUILD_FE: ${{ steps.ref.outputs.build_fe }}
        with:
          host: ${{ secrets.LEX_WEDOS_SSH_HOST }}
          username: ${{ secrets.LEX_WEDOS_SSH_USER }}
          key: ${{ secrets.LEX_WEDOS_SSH_KEY }}
          port: ${{ secrets.LEX_WEDOS_SSH_PORT || 22 }}
          envs: GHCR_USER,GHCR_TOKEN,DEPLOY_SHA,DEPLOY_TAG,BUILD_FE
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/lucky/projects/apps/lex
            free -h
            df -h /

            if [ ! -d backend/.git ]; then
              echo "backend clone missing under /home/lucky/projects/apps/lex/backend" >&2
              exit 1
            fi

            git -C backend fetch origin main
            git -C backend checkout --force "$DEPLOY_SHA" || git -C backend checkout --force origin/main
            cp -f backend/docker-compose.lex.prod.yml ./docker-compose.lex.prod.yml

            touch .env.prod
            if grep -q '^LEX_API_IMAGE=' .env.prod; then
              sed -i "s|^LEX_API_IMAGE=.*|LEX_API_IMAGE=ghcr.io/lakyn80/nalus-api:${DEPLOY_TAG}|" .env.prod
            else
              echo "LEX_API_IMAGE=ghcr.io/lakyn80/nalus-api:${DEPLOY_TAG}" >> .env.prod
            fi
            if [ "$BUILD_FE" = "true" ]; then
              if grep -q '^LEX_FE_IMAGE=' .env.prod; then
                sed -i "s|^LEX_FE_IMAGE=.*|LEX_FE_IMAGE=ghcr.io/lakyn80/nalus-fe:${DEPLOY_TAG}|" .env.prod
              else
                echo "LEX_FE_IMAGE=ghcr.io/lakyn80/nalus-fe:${DEPLOY_TAG}" >> .env.prod
              fi
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.lex.prod.yml --env-file .env.prod pull api
            if [ "$BUILD_FE" = "true" ]; then
              docker compose -f docker-compose.lex.prod.yml --env-file .env.prod pull frontend
            fi
            docker compose -f docker-compose.lex.prod.yml --env-file .env.prod up -d
            docker logout ghcr.io || true

            sleep 8
            curl -sf http://127.0.0.1:8029/health >/dev/null
            docker ps --filter name=lex-
            free -h
            df -h /
