name: Docker Publish

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag
        required: true
        default: latest
      push_latest:
        description: Also push latest tag
        required: true
        default: "true"
      skip_exporter:
        description: Skip exporter image
        required: true
        default: "false"
  push:
    tags:
      - "docker-v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Resolve publish settings
        id: prep
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          DISPATCH_PUSH_LATEST: ${{ github.event.inputs.push_latest }}
          DISPATCH_SKIP_EXPORTER: ${{ github.event.inputs.skip_exporter }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          namespace="${DOCKERHUB_NAMESPACE:-${DOCKERHUB_USERNAME:-}}"
          if [[ -z "$namespace" ]]; then
            echo "Set repo variable DOCKERHUB_NAMESPACE or secret DOCKERHUB_USERNAME." >&2
            exit 1
          fi

          if [[ "$REF_TYPE" == "tag" ]]; then
            image_tag="${REF_NAME#docker-v}"
            push_latest="true"
            skip_exporter="false"
          else
            image_tag="${DISPATCH_IMAGE_TAG:-latest}"
            push_latest="${DISPATCH_PUSH_LATEST:-true}"
            skip_exporter="${DISPATCH_SKIP_EXPORTER:-false}"
          fi

          api_tags="docker.io/$namespace/nalus-scraper-api:$image_tag"
          exporter_tags="docker.io/$namespace/nalus-scraper-eval-exporter:$image_tag"

          if [[ "$push_latest" == "true" && "$image_tag" != "latest" ]]; then
            api_tags+=$'\n'"docker.io/$namespace/nalus-scraper-api:latest"
            exporter_tags+=$'\n'"docker.io/$namespace/nalus-scraper-eval-exporter:latest"
          fi

          {
            echo "namespace=$namespace"
            echo "image_tag=$image_tag"
            echo "push_latest=$push_latest"
            echo "skip_exporter=$skip_exporter"
            echo "api_tags<<EOF"
            echo "$api_tags"
            echo "EOF"
            echo "exporter_tags<<EOF"
            echo "$exporter_tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.prep.outputs.api_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push exporter image
        if: steps.prep.outputs.skip_exporter != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.eval-exporter
          push: true
          tags: ${{ steps.prep.outputs.exporter_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
