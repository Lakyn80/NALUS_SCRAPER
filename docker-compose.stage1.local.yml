# Local Stage 1 deploy overlay.
# Uses the existing nalus-scraper Qdrant + storage/models; does not recreate indexes.
#
# Slice 4 profile pins (ops overrides below; code defaults still in retrieval_profiles.py):
#   FAST → chunk_ab_v8_a_current_full  (full-corpus A; hierarchical)
#   CE   → chunk_ab_v8_b_contextual_300 (pilot B until full B finishes)
# Legacy NALUS_LEGAL_V2_QDRANT_COLLECTION / BM25_* below are shared knobs /
# path-prefix hints only; Stage1 search overrides collection+BM25 per profile.
#
# Usage (PowerShell, from repo root):
#   docker stop nalus-scraper-api-1
#   docker compose -f docker-compose.yml -f docker-compose.stage1.local.yml up -d --build --no-deps api
#
# Do NOT start the worktree `qdrant` service for this overlay — it may be empty.

services:
  api:
    ports:
      - "8029:8000"
    environment:
      # Explicit container DNS — avoid resolving to this worktree's empty `qdrant` service.
      QDRANT_URL: http://nalus-scraper-qdrant-1:6333
      # Full-document reconstruction aligned with FAST full-corpus A.
      QDRANT_COLLECTION_NAME: nalus_legal_paragraph_chunks_v2_chunk_ab_v8_a_current_full
      NALUS_FULL_DOCUMENT_QDRANT_COLLECTION: nalus_legal_paragraph_chunks_v2_chunk_ab_v8_a_current_full
      NALUS_LEGAL_V2_SEARCH_ENABLED: "1"
      NALUS_LEGAL_V2_CASE_SIMILARITY_ENABLED: "1"
      # Always warm Stage1 on boot (BGE-M3 + CE BM25). Skip FAST full BM25 warm —
      # loading the ~10GB in-memory index OOM'd the host alongside full-B GPU ingest.
      # While full-B runs on 16GB hosts, also skip FAST BM25 on query (dense-only).
      NALUS_LEGAL_V2_STAGE1_WARMUP_ON_START: "1"
      NALUS_LEGAL_V2_STAGE1_WARMUP_FAST_BM25: "0"
      NALUS_LEGAL_V2_STAGE1_FAST_DENSE_ONLY: "1"
      NALUS_LEGAL_V2_LONG_INPUT_ENABLED: "0"
      NALUS_LEGAL_V2_LONG_INPUT_METHOD: extractive
      NALUS_LEGAL_V2_CROSS_ENCODER_ENABLED: "1"
      NALUS_LEGAL_V2_CROSS_ENCODER_MODEL: BAAI/bge-reranker-v2-m3
      NALUS_LEGAL_V2_CE_CANDIDATE_DOCUMENTS: "30"
      NALUS_LEGAL_V2_CE_PASSAGES_PER_DOCUMENT: "7"
      NALUS_LEGAL_V2_CE_PASSAGE_SELECTOR: diversified_stage1_evidence_v1
      NALUS_LEGAL_V2_CE_EVIDENCE_POOL_LIMIT: "40"
      NALUS_LEGAL_V2_CE_BATCH_SIZE: "8"
      NALUS_LEGAL_V2_CE_DEVICE: cpu
      NALUS_LEGAL_V2_CE_MAX_LENGTH: "512"
      NALUS_LEGAL_V2_CE_ALLOW_DOWNLOAD: "0"
      # FAST = full corpus A (product search default).
      NALUS_LEGAL_V2_FAST_QDRANT_COLLECTION: nalus_legal_paragraph_chunks_v2_chunk_ab_v8_a_current_full
      NALUS_LEGAL_V2_FAST_BM25_INDEX_ID: nalus_legal_paragraph_bm25_v2_chunk_ab_v8_a_current_full
      NALUS_LEGAL_V2_FAST_BM25_SIDECAR_PATH: /app/storage/rag/bm25/nalus_legal_paragraph_bm25_v2_chunk_ab_v8_a_current_full.sqlite
      # PRECISE/CE stays on pilot B until full B (+ ColBERT) is ready.
      NALUS_LEGAL_V2_CE_QDRANT_COLLECTION: nalus_legal_paragraph_chunks_v2_chunk_ab_v8_b_contextual_300
      NALUS_LEGAL_V2_CE_BM25_INDEX_ID: nalus_legal_paragraph_bm25_v2_chunk_ab_v8_b_contextual_300
      NALUS_LEGAL_V2_CE_BM25_SIDECAR_PATH: /app/storage/rag/bm25/nalus_legal_paragraph_bm25_v2_chunk_ab_v8_b_contextual_300.sqlite
      # Legacy shared knobs (full-doc / non-profile paths) → full A.
      NALUS_LEGAL_V2_QDRANT_COLLECTION: nalus_legal_paragraph_chunks_v2_chunk_ab_v8_a_current_full
      NALUS_LEGAL_V2_BM25_SIDECAR_PATH: /app/storage/rag/bm25/nalus_legal_paragraph_bm25_v2_chunk_ab_v8_a_current_full.sqlite
      NALUS_LEGAL_V2_BM25_INDEX_ID: nalus_legal_paragraph_bm25_v2_chunk_ab_v8_a_current_full
      NALUS_LEGAL_V2_DEFAULT_RESULT_LIMIT: "10"
      NALUS_LEGAL_V2_MAX_RESULT_LIMIT: "50"
      NALUS_LEGAL_V2_CANDIDATE_DOCUMENTS: "50"
      NALUS_LEGAL_V2_DEBUG: "0"
      EMBEDDING_MODEL_NAME: /root/.cache/huggingface/hub/models--BAAI--bge-m3/snapshots/5617a9f61b028005a4858fdac845db406aefb181
      EMBEDDING_LOCAL_FILES_ONLY: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./benchmarks:/app/benchmarks:ro
      - ./artifacts:/app/artifacts
      - ../nalus-scraper/storage:/app/storage
      - ../nalus-scraper/models:/app/models:ro
      - ../nalus-scraper/batches:/app/batches:ro
      - nalus_scraper_hf_cache:/root/.cache/huggingface
    networks:
      - default
      - nalus_scraper_net

volumes:
  nalus_scraper_hf_cache:
    external: true
    name: nalus-scraper_huggingface_cache

networks:
  nalus_scraper_net:
    external: true
    name: nalus-scraper_default
